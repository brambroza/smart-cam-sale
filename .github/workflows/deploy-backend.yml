name: Deploy backend (API + AI) to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/ai-service/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/smart-cam-api
  IMAGE_AI: ${{ github.repository_owner }}/smart-cam-ai

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_tag: ${{ steps.meta.outputs.api_tag }}
      ai_tag: ${{ steps.meta.outputs.ai_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          echo "api_tag=${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ai_tag=${{ env.REGISTRY }}/${{ env.IMAGE_AI }}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push AI image
        uses: docker/build-push-action@v6
        with:
          context: apps/ai-service
          push: true
          tags: |
            ${{ steps.meta.outputs.ai_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_AI }}:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update AI Container App
        run: |
          az containerapp update \
            -n "${{ secrets.AZURE_AI_APP }}" \
            -g "${{ secrets.AZURE_RG }}" \
            --image "${{ needs.build-push.outputs.ai_tag }}"

      - name: Update API Container App
        run: |
          az containerapp update \
            -n "${{ secrets.AZURE_API_APP }}" \
            -g "${{ secrets.AZURE_RG }}" \
            --image "${{ needs.build-push.outputs.api_tag }}"

      - name: Show revision status
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API image: \`${{ needs.build-push.outputs.api_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI image:  \`${{ needs.build-push.outputs.ai_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          API_URL=$(az containerapp show -n "${{ secrets.AZURE_API_APP }}" -g "${{ secrets.AZURE_RG }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "- API URL: https://$API_URL" >> "$GITHUB_STEP_SUMMARY"
