name: Deploy backend (API + AI) to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/ai-service/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/smart-cam-api
  IMAGE_AI: ${{ github.repository_owner }}/smart-cam-ai

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smart-cam/api exec prisma generate
      - name: API unit tests (gate — no image ships if these fail)
        run: pnpm --filter @smart-cam/api run test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_tag: ${{ steps.meta.outputs.api_tag }}
      ai_tag: ${{ steps.meta.outputs.ai_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          echo "api_tag=${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ai_tag=${{ env.REGISTRY }}/${{ env.IMAGE_AI }}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ steps.meta.outputs.api_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest

      - name: Build & push AI image
        uses: docker/build-push-action@v6
        with:
          context: apps/ai-service
          push: true
          tags: |
            ${{ steps.meta.outputs.ai_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_AI }}:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

  # Passwordless deploy via GitHub OIDC federated credentials.
  # Runs only after infra/setup-oidc.sh has been executed once and the repo
  # variable AZURE_OIDC_READY is set to '1' — until then this job is skipped
  # (not failed) and deploys happen manually via infra/deploy.sh.
  deploy:
    needs: build-push
    if: ${{ vars.AZURE_OIDC_READY == '1' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RG: ${{ vars.AZURE_RG || 'smart-cam-rg' }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP || 'smart-cam-api' }}
      AZURE_AI_APP: ${{ vars.AZURE_AI_APP || 'smart-cam-ai' }}
    steps:
      - name: Azure login (OIDC — no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update AI Container App
        run: |
          az containerapp update \
            -n "$AZURE_AI_APP" -g "$AZURE_RG" \
            --image "${{ needs.build-push.outputs.ai_tag }}"
          # Ensure ingress port matches the real service (idempotent)
          az containerapp ingress update \
            -n "$AZURE_AI_APP" -g "$AZURE_RG" --target-port 8000 || true

      - name: Update API Container App
        run: |
          az containerapp update \
            -n "$AZURE_API_APP" -g "$AZURE_RG" \
            --image "${{ needs.build-push.outputs.api_tag }}" \
            --set-env-vars "APP_VERSION=${GITHUB_SHA::7}"
          az containerapp ingress update \
            -n "$AZURE_API_APP" -g "$AZURE_RG" --target-port 3000 || true

      - name: Show revision status
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API image: \`${{ needs.build-push.outputs.api_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI image:  \`${{ needs.build-push.outputs.ai_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          API_URL=$(az containerapp show -n "$AZURE_API_APP" -g "$AZURE_RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "- API URL: https://$API_URL" >> "$GITHUB_STEP_SUMMARY"
