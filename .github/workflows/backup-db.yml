name: Nightly DB backup

# Free-tier backup: pg_dump of the Neon database every night at 03:30 Asia/Bangkok
# (20:30 UTC), stored as a GitHub Actions artifact for 30 days. This is the
# stop-gap until the paid tier (Neon Launch has real PITR) — see
# docs/PAID-TIER-PLAN.md.
#
# Requires repo secret DIRECT_DATABASE_URL (the Neon *direct* connection string,
# not the -pooler one). The job skips cleanly when the secret is not set.
#
# NOTE: scheduled workflows only run from the DEFAULT branch.

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secret
        id: gate
        run: |
          if [ -z "${{ secrets.DIRECT_DATABASE_URL }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DIRECT_DATABASE_URL secret ไม่ได้ตั้ง — ข้าม backup (ตั้งใน Settings → Secrets → Actions)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgresql client 16
        if: steps.gate.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 || sudo apt-get install -y -qq postgresql-client

      - name: pg_dump
        if: steps.gate.outputs.skip == 'false'
        env:
          DB_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --file "smartcam-$STAMP.dump"
          ls -lh smartcam-*.dump
          echo "restore ด้วย: pg_restore --no-owner -d \$NEW_DB_URL smartcam-$STAMP.dump"

      - name: Upload artifact (30-day retention)
        if: steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: smartcam-*.dump
          retention-days: 30
          if-no-files-found: error
